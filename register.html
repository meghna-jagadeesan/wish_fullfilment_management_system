{% extends 'base.html' %}{% block title %}Create account | WishBridge{% endblock %}{% block content %}<div class="form-wrap"><span class="eyebrow">Join the community</span><h1>Create an account</h1><p>Choose the role that matches how you want to use WishBridge.</p><form method="post" class="form"><label>Full name<input name="name" required maxlength="100"></label><label>Email address<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required><small>At least 6 characters.</small></label><label>I want to<select name="role" required><option value="beneficiary">Request assistance (beneficiary / guardian)</option><option value="donor">Offer assistance (donor)</option></select></label><button class="btn full">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div>{% endblock %}
